name: Integrate remaining open PRs

on:
  push:
    branches:
      - integration/resolve-open-prs-20260817

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v7
        with:
          ref: integration/resolve-open-prs-20260817
          fetch-depth: 0

      - name: Merge reviewed PR branches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while read -r number branch; do
            echo "::group::Merge PR #${number} (${branch})"
            git fetch --no-tags origin \
              "refs/heads/${branch}:refs/remotes/incoming/pr-${number}"
            git merge --no-ff --no-edit \
              "refs/remotes/incoming/pr-${number}" \
              -m "Merge reviewed PR #${number} into integration branch"
            echo "::endgroup::"
          done <<'PRS'
          18 codex/propose-fix-for-zip-digest-vulnerability
          20 codex/fix-unbounded-xliff-xml-parsing-vulnerability
          22 codex/propose-fix-for-version-branch-audits
          23 codex/fix-over-broad-actions-write-permission
          24 codex/fix-symlink-traversal-in-asset-cleanup
          25 codex/fix-symlink-handling-in-translation-refresh
          27 codex/fix-path-traversal-vulnerability-in-merge
          28 codex/fix-path-traversal-vulnerability-in-cleanup
          30 codex/propose-fix-for-quadratic-dos-vulnerability
          31 codex/propose-fix-for-jinja-placeholder-vulnerability
          32 codex/fix-arbitrary-file-upload-vulnerability
          34 codex/fix-local-path-and-identifier-exposure
          PRS

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: make install-dev

      - name: Normalize merged source and remove helper
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff format --config config/ruff.toml \
            docs/conf.py scripts/ci/*.py src tests
          .venv/bin/python -m ruff check --fix --config config/ruff.toml \
            scripts/ci src tests
          .venv/bin/python -m ruff format --config config/ruff.toml \
            docs/conf.py scripts/ci/*.py src tests
          rm -f .github/workflows/_integrate_open_prs_20260817.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize integrated security fixes"
          fi
          git push origin HEAD:integration/resolve-open-prs-20260817
