name: Fix PR 28 lint

on:
  push:
    branches:
      - codex/fix-path-traversal-vulnerability-in-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: codex/fix-path-traversal-vulnerability-in-cleanup

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install-dev

      - name: Fix lint and remove helper
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff check --fix --config config/ruff.toml \
            scripts/ci/upstream_template_artifacts.py \
            tests/infra/test_cli_entrypoints.py
          .venv/bin/python -m ruff format --config config/ruff.toml \
            scripts/ci/upstream_template_artifacts.py \
            tests/infra/test_cli_entrypoints.py
          rm -f .github/workflows/_agent_fix_lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: organize artifact cleanup imports"
          git push origin HEAD:codex/fix-path-traversal-vulnerability-in-cleanup
