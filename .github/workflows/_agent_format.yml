name: Agent format

on:
  push:
    branches:
      - codex/propose-fix-for-zip-bomb-vulnerability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: codex/propose-fix-for-zip-bomb-vulnerability

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install-dev

      - name: Format and remove helper
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff format --config config/ruff.toml docs/conf.py scripts/ci/*.py src tests
          rm -f .github/workflows/_agent_format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format PR 19"
          git push origin HEAD:codex/propose-fix-for-zip-bomb-vulnerability
