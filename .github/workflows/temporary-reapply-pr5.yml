name: temporary-reapply-pr5

on:
  push:
    branches:
      - codex/fix-clean-artifact-symlink-vulnerability

permissions:
  contents: write

jobs:
  reapply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.1
      - name: Reapply clean-artifact symlink rejection
        run: |
          set -euo pipefail
          backup_ref="agent/backup-pr5-20260806"
          git fetch --no-tags origin "$backup_ref:refs/remotes/origin/$backup_ref"
          git diff --binary 7833aeb452f9bd36749156a2cd24fe4b8879e2cf "origin/$backup_ref" -- \
            scripts/ci/create_translation_migration_prs.py \
            tests/infra/test_translation_migration_prs.py > /tmp/pr.patch
          test -s /tmp/pr.patch
          git apply --3way --index /tmp/pr.patch
          python -m ruff check --fix --config config/ruff.toml \
            scripts/ci/create_translation_migration_prs.py \
            tests/infra/test_translation_migration_prs.py
          python -m ruff format --config config/ruff.toml \
            scripts/ci/create_translation_migration_prs.py \
            tests/infra/test_translation_migration_prs.py
          git add -- \
            scripts/ci/create_translation_migration_prs.py \
            tests/infra/test_translation_migration_prs.py
          git diff --cached --check
          git rm -- .github/workflows/temporary-reapply-pr5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: reject symlinks in clean-artifact restore"
          git push origin "HEAD:${GITHUB_REF_NAME}"
